# Customer storefront: https://skshopping.store -> FastAPI on 127.0.0.1:8000
# The same FastAPI process also exposes the internal JSON API, which must
# NOT be reachable from the public site — those paths return 404 here.
#
# Install:
#   sudo cp deploy/shop-nginx.conf /etc/nginx/sites-available/shop
#   sudo ln -sf /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop
#   sudo nginx -t && sudo systemctl reload nginx
# The production certificate must already exist at the paths below. For a
# first-time server, obtain it before installing this final configuration.

server {
    listen 80;
    server_name skshopping.store www.skshopping.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skshopping.store www.skshopping.store;

    ssl_certificate /etc/letsencrypt/live/skshopping.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skshopping.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Block the internal API/docs from the public storefront domain.
    location ~ ^/(docs|redoc|openapi\.json|users|products|orders|payments)(/|$) {
        return 404;
    }

    # Signed Pandora callbacks are handled by FastAPI. This explicit route
    # documents the intended exception without exposing the internal API.
    location = /webhooks/pandora {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
