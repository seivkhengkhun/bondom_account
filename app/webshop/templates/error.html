{% extends "base.html" %}
{% block title %}{{ code }} — Bondom{% endblock %}
{% block content %}
  <div class="error-page">
    <p class="error-code">ERROR {{ code }}</p>
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="/shop">
        <svg class="ic ic-sm" aria-hidden="true"><use href="#i-grid"/></svg> Go to the shop
      </a>
      {% if session_user %}
        <a class="btn btn-outline" href="/my/orders">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#i-package"/></svg> My orders
        </a>
      {% endif %}
      {% if bot_username %}
        <a class="btn btn-ghost" href="https://t.me/{{ bot_username }}">
          <svg class="ic ic-sm ic-tg" aria-hidden="true"><use href="#i-tg"/></svg> Get help
        </a>
      {% endif %}
    </div>
  </div>
{% endblock %}
