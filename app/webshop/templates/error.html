{% extends "base.html" %}
{% block title %}{{ code }} — Bondom Account{% endblock %}
{% block content %}
  <div class="error-page">
    <p class="error-code">{{ code }}</p>
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>

    <div class="error-actions">
      <a class="btn btn-primary" href="/">
        <svg class="ic ic-sm" aria-hidden="true"><use href="#i-home"/></svg>
        Back to the catalog
      </a>
      {% if session_user %}
        <a class="btn btn-outline" href="/my/orders">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#i-package"/></svg>
          My orders
        </a>
      {% endif %}
      {% if bot_username %}
        <a class="btn btn-outline" href="https://t.me/{{ bot_username }}">
          <svg class="ic ic-sm ic-tg" aria-hidden="true"><use href="#i-tg"/></svg>
          Get help
        </a>
      {% endif %}
    </div>
  </div>
{% endblock %}
